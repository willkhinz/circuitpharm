name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # LEAN install: core only, no MuJoCo body plant and no RDKit. This is what most users
  # will have, and it is the configuration that actually broke -- evaluate() crashed
  # without the plant because the ImportError surfaced on first CALL rather than at import,
  # outside the guard. It passed on a developer machine purely because MuJoCo happened to
  # be present there. So the lean install gets its own job.
  lean:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        # FETCH TAGS. The default is fetch-depth: 1 with fetch-tags: false, so
        # `git cat-file -t manuscript-v3` fails on the runner and
        # tests/test_manuscript_consistency.py::test_the_cited_commit_and_tag_exist
        # reports the manuscript's reproducibility anchor as missing when it exists and
        # points at the right commit. Verified in CI: "fatal: Not a valid object name
        # manuscript-v3" (roadmap P0-7).
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + test tools only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Confirm the optional extras really are absent
        run: |
          python - <<'PY'
          for m in ("mujoco", "rdkit"):
              try:
                  __import__(m)
                  raise SystemExit(f"{m} is installed; this job must test the LEAN install")
              except ImportError:
                  print(f"{m} absent, as intended")
          PY
      - name: Fast tests
        run: pytest -m "not slow" -q -rs
      - name: Circuit integration tests
        run: pytest -m slow -q -rs

  # FULL install: adds the body plant and the chemistry tools, so the reflex, locomotor and
  # parity tests actually run instead of skipping. This is the job that exercises the
  # published phenotypes.
  full:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # FETCH TAGS. The default is fetch-depth: 1 with fetch-tags: false, so
        # `git cat-file -t manuscript-v3` fails on the runner and
        # tests/test_manuscript_consistency.py::test_the_cited_commit_and_tag_exist
        # reports the manuscript's reproducibility anchor as missing when it exists and
        # points at the right commit. Verified in CI: "fatal: Not a valid object name
        # manuscript-v3" (roadmap P0-7).
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install everything
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pytest-xdist pytest-cov
      - name: Full suite with coverage
        # Deliberately NO MUJOCO_GL. MuJoCo only initialises a GL context when a renderer
        # is created, and nothing here renders -- the plant calls mj_forward/mj_step and
        # reads state. Setting MUJOCO_GL=osmesa would instead ADD a failure mode, since it
        # needs libosmesa6 present on the runner. (This project already hit the mirror of
        # that: MUJOCO_GL=osmesa is an invalid backend on macOS and raises at import.)
        #
        # ONE RUN, NOT TWO. The skip check used to re-run the whole suite, which doubled
        # the job for a grep. That was already wasteful and became a timeout risk when P4-P6
        # added ~10 minutes of chains, recovery checks and interval calibration. The run's
        # own `-rs` output is captured here and the next step greps it.
        run: |
          set -o pipefail
          pytest -q -rs --cov --cov-report=term --cov-fail-under=90 2>&1 | tee /tmp/out.txt
      - name: Assert nothing was skipped
        # `-rs` lists skip reasons, so a skip is visible in the summary above. On the FULL
        # install there is no legitimate reason to skip: every optional dependency is
        # present, so a skip means one failed to import.
        run: |
          if grep -qiE "^SKIPPED|[0-9]+ skipped" /tmp/out.txt; then
            echo "Tests skipped on the FULL install -- an optional dependency is missing"
            grep -iE "^SKIPPED|skipped" /tmp/out.txt
            exit 1
          fi
          echo "nothing skipped"
