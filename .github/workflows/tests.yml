name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The MuJoCo body plant and RDKit are optional extras. The receptor, kinetic and
      # circuit layers -- which is what the test suite covers -- need only numpy + scipy,
      # so CI installs the lean set and stays fast.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fast tests
        run: pytest -m "not slow" -q

      # The slow tests integrate full 14-30 s circuit simulations (the strychnine
      # phenotype, the preBotC rhythmogenesis checks). They are the ones that would
      # actually catch a regression in the dynamics, so they run too -- just separately,
      # so a failure says which kind it was.
      - name: Circuit integration tests
        run: pytest -m slow -q
