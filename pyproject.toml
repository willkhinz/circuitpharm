[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitpharm"
version = "0.1.0"
description = "Receptor-resolved pharmacology coupled to spiking neural circuit models, with calibration and identifiability analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "William Hinz", email = "hinzwilliam52@gmail.com" }]
keywords = ["computational neuroscience", "pharmacology", "GABA-A",
            "respiratory rhythm", "spiking networks", "identifiability"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
# the MuJoCo body plant; not needed for the receptor or circuit layers
plant = ["mujoco>=3.1", "dm_control>=1.0.20"]
# chirality / cheminformatics tools
chem = ["rdkit>=2023.9"]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "pytest-cov>=5.0"]
all = ["mujoco>=3.1", "dm_control>=1.0.20", "rdkit>=2023.9", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The repository root on sys.path, so `from scripts.literature_gamma2 import ...` resolves.
#
# WITHOUT THIS THE SUITE PASSES LOCALLY AND FAILS IN CI, which is the worst failure mode a
# test config has. `python -m pytest` prepends the current directory to sys.path and bare
# `pytest` does not, so tests/test_literature.py collected fine for its author and for the
# cloud session -- both of whom ran `python -m pytest` -- and died in CI, which runs bare
# `pytest`, with "ModuleNotFoundError: No module named 'scripts'". `scripts/__init__.py`
# already existed; being a package is not enough when the directory above it is unreachable.
#
# Fixed here rather than by rewriting the import, because the discrepancy is in how the
# suite is invoked and would otherwise bite the next module that imports from scripts/.
pythonpath = ["."]
# the circuit tests integrate 14-30 s of network activity; they are slow by nature
markers = ["slow: integrates a full circuit simulation (seconds to minutes)"]
# Parallel by default. The suite is embarrassingly parallel (every test builds its own
# network with its own seed and shares no state) and is dominated by circuit integration,
# so this is the difference between 7m16s and ~2.5 min on this 10-core machine.
#
# `auto`, NOT a fixed count. This was briefly `-n 8`, which is right for one machine and
# wrong everywhere else: on a 2-core CI runner eight workers each running a MuJoCo/numpy
# simulation thrash rather than parallelise. `auto` matches the host.
#
# Override with `-n 0` when debugging, since xdist hides stdout.
addopts = "-n auto"

# ProvisionalResultWarning must never be swallowed by the suite.
#
# `provisional.py` installs simplefilter("always") for its own category at import, because
# Python's default shows a UserWarning once per code location per process -- which reaches
# whoever makes the first call and nobody after. This entry makes the same guarantee hold
# under pytest, whose own filters would otherwise take precedence. The banner marks
# machinery whose CONCLUSIONS rest on a recorded defect (roadmap P0-5/P0-6); if it stops
# appearing, either the defect was fixed and the warning removed deliberately, or
# something is hiding it.
filterwarnings = [
  "always::circuitpharm.provisional.ProvisionalResultWarning",
]

[tool.coverage.run]
source = ["circuitpharm"]
# plant.py and chirality.py need optional extras (mujoco, rdkit); when those are absent
# their lines are unreachable rather than untested, so leaving them in would understate
# coverage for anyone running the lean install.
omit = ["*/chirality.py"]

[tool.coverage.report]
# NO fail_under HERE, deliberately. A threshold in this file fires on ANY coverage run, so
# `pytest -m "not slow" --cov` failed at 65% with every test passing -- the fast subset
# legitimately does not exercise the circuit integration, so that failure carried no
# information and would have trained people to pass --no-cov.
#
# The threshold is enforced in CI on the FULL suite instead, via --cov-fail-under=90 (see
# .github/workflows/tests.yml), which is where it means something. Measured 95% after
# extracting the rejected HalfCentreCPG (108 lines of dead code reachable only from
# archived scripts, which alone took cpg.py from 67% to 94%). Raise that CI floor over
# time, never lower it: a drop means dead code crept back or something shipped untested.
exclude_also = [
  "if __name__ == .__main__.:",
  "raise FileNotFoundError",
  "except ImportError",
  "if TYPE_CHECKING:",
]
