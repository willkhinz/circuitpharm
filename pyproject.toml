[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitpharm"
version = "0.1.0"
description = "Receptor-resolved pharmacology coupled to spiking neural circuit models, with calibration and identifiability analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "William Hinz", email = "hinzwilliam52@gmail.com" }]
keywords = ["computational neuroscience", "pharmacology", "GABA-A",
            "respiratory rhythm", "spiking networks", "identifiability"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
# the MuJoCo body plant; not needed for the receptor or circuit layers
plant = ["mujoco>=3.1", "dm_control>=1.0.20"]
# chirality / cheminformatics tools
chem = ["rdkit>=2023.9"]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "pytest-cov>=5.0"]
all = ["mujoco>=3.1", "dm_control>=1.0.20", "rdkit>=2023.9", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the circuit tests integrate 14-30 s of network activity; they are slow by nature
markers = ["slow: integrates a full circuit simulation (seconds to minutes)"]
# Parallel by default. The suite is embarrassingly parallel (every test builds its own
# network with its own seed and shares no state), and it is dominated by circuit
# integration, so this is the difference between 7m16s and 2m35s on 8 workers.
# Override with `-p no:xdist` or `-n 0` when debugging, since xdist hides stdout.
addopts = "-n 8"

[tool.coverage.run]
source = ["circuitpharm"]
# plant.py and chirality.py need optional extras (mujoco, rdkit); when those are absent
# their lines are unreachable rather than untested, so leaving them in would understate
# coverage for anyone running the lean install.
omit = ["*/chirality.py"]

[tool.coverage.report]
# Measured 95% at session 8, after extracting the rejected all-spiking HalfCentreCPG to
# scripts/archive (108 lines of dead code reachable only from archived scripts, which alone
# took cpg.py from 67% to 94%). The uncovered remainder is in branches needing the optional
# body plant and in error paths of the model-path resolver. Raise this floor, never lower
# it: a drop means either dead code has crept back in or something shipped untested.
fail_under = 90
exclude_also = [
  "if __name__ == .__main__.:",
  "raise FileNotFoundError",
  "except ImportError",
  "if TYPE_CHECKING:",
]
